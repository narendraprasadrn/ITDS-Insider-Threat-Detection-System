version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: itds-mysql
    restart: unless-stopped
    command: >
      --log-output=TABLE
      --general-log=1
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: RootSecretPassword123!
      MYSQL_DATABASE: itds_app
    ports:
      - "3306:3306"
    volumes:
      - ./scripts/mysql-init:/docker-entrypoint-initdb.d:ro
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pRootSecretPassword123!"]
      interval: 5s
      timeout: 5s
      retries: 10

  opa:
    image: openpolicyagent/opa:latest
    container_name: itds-opa
    restart: unless-stopped
    command: run --server --log-level=info --addr=:8181 /policies
    ports:
      - "8181:8181"
    volumes:
      - ./policies:/policies:ro
    healthcheck:
      test: ["CMD", "opa", "version"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  mysql_data:
    driver: local
